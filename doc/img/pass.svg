<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 294" role="img" aria-labelledby="title description">
<title id="title">Step 3: Lingtai runs Chapter Garden to the landing hold</title>
<desc id="description">The pass claims a ticket, creates a worktree, installs dependencies, lets Claude Code write the chapter, runs the checks, and asks Claude Code to review. It then waits at the proposed step for your approval. A failed build can return to Claude Code for a fix round.</desc>
<style>
:root{--fg:#0f181c;--mute:#51636a;--line:#8aa0a6;--fill:rgba(11,106,112,.06);--acc:#0b6a70;--accf:rgba(11,106,112,.14);--warn:#a4540a;--warnf:rgba(164,84,10,.12)}
@media (prefers-color-scheme:dark){:root{--fg:#dde6e8;--mute:#93a7ad;--line:#5d757b;--fill:rgba(84,198,204,.07);--acc:#54c6cc;--accf:rgba(84,198,204,.16);--warn:#e8a25c;--warnf:rgba(232,162,92,.14)}}
text{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
.title{font-size:15px;font-weight:700}.step{font-size:10.5px;fill:var(--mute)}.name{font-size:14px;font-weight:600}.detail{font-size:11.5px;fill:var(--mute)}.note{font-size:12px;fill:var(--mute)}
.box{fill:var(--fill);stroke:var(--line);stroke-width:1.2}.accent{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.hold{fill:var(--warnf);stroke:var(--warn);stroke-width:1.6}
.arrow{fill:none;stroke:var(--line);stroke-width:1.5;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<text class="title" x="18" y="27">lingtai start · one pass to your approval</text>
<rect class="box" x="18" y="50" width="190" height="62" rx="7"/>
<text class="step" x="32" y="69">1 · claim</text><text class="name" x="32" y="88">Take the ticket</text><text class="detail" x="32" y="103">feature enters the queue</text>
<rect class="box" x="228" y="50" width="190" height="62" rx="7"/>
<text class="step" x="242" y="69">2 · admit</text><text class="name" x="242" y="88">Create a worktree</text><text class="detail" x="242" y="103">from main</text>
<rect class="box" x="438" y="50" width="190" height="62" rx="7"/>
<text class="step" x="452" y="69">3 · prepared</text><text class="name" x="452" y="88">Install dependencies</text><text class="detail" x="452" y="103">npm ci</text>
<rect class="accent" x="648" y="50" width="190" height="62" rx="7"/>
<text class="step" x="662" y="69">5 · implement</text><text class="name" x="662" y="88">Claude Code writes</text><text class="detail" x="662" y="103">the next chapter</text>
<path class="arrow" d="M208 81H226"/><path class="arrow" d="M418 81H436"/><path class="arrow" d="M628 81H646"/>
<path class="arrow" d="M743 112V164"/>
<text class="note" x="18" y="153">4 · design has no action in this recipe.</text>
<rect class="box" x="648" y="166" width="190" height="62" rx="7"/>
<text class="step" x="662" y="185">6 · build</text><text class="name" x="662" y="204">Check the site</text><text class="detail" x="662" y="219">npm run check · build</text>
<rect class="box" x="438" y="166" width="190" height="62" rx="7"/>
<text class="step" x="452" y="185">7 · review</text><text class="name" x="452" y="204">Claude Code reviews</text><text class="detail" x="452" y="219">the change cold</text>
<rect class="hold" x="228" y="166" width="190" height="62" rx="7"/>
<text class="step" x="242" y="185">8 · proposed</text><text class="name" x="242" y="204">Waiting on you</text><text class="detail" x="242" y="219">landing hold from the recipe</text>
<path class="arrow" d="M648 197H630"/><path class="arrow" d="M438 197H420"/>
<text class="note" x="18" y="270">A failed build can return to Claude Code for a fix round. Approval, merge and end are in Step 4.</text>
</svg>
