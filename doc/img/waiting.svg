<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="title description">
<title id="title">Step 4: approve the held change and confirm it landed</title>
<desc id="description">At the landing hold, review the chapter and checks, approve on the Board or with the CLI, then Lingtai resumes the held pass, merges into your tutorial branch, and marks the ticket Landed.</desc>
<style>
:root{--fg:#0f181c;--mute:#51636a;--line:#8aa0a6;--fill:rgba(11,106,112,.06);--acc:#0b6a70;--accf:rgba(11,106,112,.14);--warn:#a4540a;--warnf:rgba(164,84,10,.12)}
@media (prefers-color-scheme:dark){:root{--fg:#dde6e8;--mute:#93a7ad;--line:#5d757b;--fill:rgba(84,198,204,.07);--acc:#54c6cc;--accf:rgba(84,198,204,.16);--warn:#e8a25c;--warnf:rgba(232,162,92,.14)}}
text{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
.title{font-size:15px;font-weight:700}.step{font-size:10.5px;fill:var(--mute)}.name{font-size:14px;font-weight:600}.detail{font-size:11.5px;fill:var(--mute)}.note{font-size:12px;fill:var(--mute)}
.box{fill:var(--fill);stroke:var(--line);stroke-width:1.2}.accent{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.hold{fill:var(--warnf);stroke:var(--warn);stroke-width:1.6}
.arrow{fill:none;stroke:var(--line);stroke-width:1.5;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<text class="title" x="16" y="27">Resolve the landing hold · then confirm the result</text>
<rect class="hold" x="16" y="55" width="152" height="68" rx="7"/>
<text class="name" x="92" y="80" text-anchor="middle">Waiting on you</text><text class="detail" x="92" y="99" text-anchor="middle">landing hold</text>
<rect class="box" x="190" y="55" width="152" height="68" rx="7"/>
<text class="name" x="266" y="80" text-anchor="middle">Review the change</text><text class="detail" x="266" y="99" text-anchor="middle">chapter and checks</text>
<rect class="accent" x="364" y="55" width="152" height="68" rx="7"/>
<text class="name" x="440" y="80" text-anchor="middle">Approve</text><text class="detail" x="440" y="99" text-anchor="middle">Board or CLI</text>
<rect class="box" x="538" y="55" width="152" height="68" rx="7"/>
<text class="name" x="614" y="80" text-anchor="middle">Merge and end</text><text class="detail" x="614" y="99" text-anchor="middle">tutorial branch</text>
<rect class="accent" x="712" y="55" width="152" height="68" rx="7"/>
<text class="name" x="788" y="80" text-anchor="middle">Landed</text><text class="detail" x="788" y="99" text-anchor="middle">confirm with status</text>
<path class="arrow" d="M168 89H188"/><path class="arrow" d="M342 89H362"/><path class="arrow" d="M516 89H536"/><path class="arrow" d="M690 89H710"/>
<text class="note" x="16" y="162">CLI: lingtai approve chapter-garden --issue N</text>
<text class="note" x="16" y="188">Approval resumes the held pass. Lingtai performs the merge; check for Landed afterward.</text>
</svg>
