<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 582" role="img" aria-labelledby="title desc">
  <title id="title">Chapter Garden recipe excerpt beside Lingtai's ten steps</title>
  <desc id="desc">Selected recipe fields, reordered to follow the pass; omitted fields mean this is not a copyable recipe. Seven short arrows link sections to steps. Design and end use defaults; repo.base also supplies the merge target.</desc>
  <style>
    :root{--ink:#13282e;--muted:#526970;--rule:#bed0d1;--paper:#f8fbfa;--panel:#fff;--accent:#087477;--teal:#157e82;--gold:#9b681c;--hold:#fff2d9}
    @media(prefers-color-scheme:dark){:root{--ink:#e7f2f2;--muted:#aec3c6;--rule:#496266;--paper:#132327;--panel:#1b3034;--accent:#75d9d2;--teal:#62c4c2;--gold:#e5bb71;--hold:#46391f}}
    text{fill:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .title{font-size:20px;font-weight:700}.sub{font-size:12px;fill:var(--muted)}
    .path{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
    .heading{fill:var(--accent);font-weight:700}
    .card-title{font-size:14px;font-weight:700}.card-note{font-size:11.5px;fill:var(--muted)}
    .num{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .wire{fill:none;stroke:var(--teal);stroke-width:2;opacity:.8}.wire-hold{stroke:var(--gold)}
    .dot{fill:var(--teal)}.dot-hold{fill:var(--gold)}
    .panel,.card{fill:var(--panel);stroke:var(--rule);stroke-width:1.2}
    .default{fill:var(--paper);stroke-dasharray:4 4}.hold{fill:var(--hold);stroke:var(--gold)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--teal)"/></marker><marker id="arrow-hold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--gold)"/></marker></defs>
  <text class="title" x="16" y="27">The recipe fills the steps</text>
  <text class="sub" x="16" y="46">Selected fields, reordered for the diagram; not a copyable recipe.</text>
  <rect class="panel" x="14" y="64" width="442" height="504" rx="7"/>
  <text class="path" x="28" y="86">~/.lingtai/chapter-garden/recipe.yml</text>
  <path d="M28 97H441" stroke="var(--rule)"/>
  <text class="path" x="510" y="86">LINGTAI · ONE TICKET</text>
<path class="wire" d="M449 151 C471 151, 483 130, 507 130" marker-end="url(#arrow)"/>
<circle class="dot" cx="449" cy="151" r="2.5"/>
