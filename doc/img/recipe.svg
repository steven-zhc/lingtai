<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" role="img" aria-label="The recipe feeds three gates on the way from issue to merge: what counts as work, what must pass, and whether a person approves.">
<style>
:root{--fg:#0f181c;--mute:#51636a;--line:#8aa0a6;--fill:rgba(11,106,112,.06);--acc:#0b6a70;--accf:rgba(11,106,112,.14);--warn:#a4540a;--warnf:rgba(164,84,10,.12)}
@media (prefers-color-scheme:dark){:root{--fg:#dde6e8;--mute:#93a7ad;--line:#5d757b;--fill:rgba(84,198,204,.07);--acc:#54c6cc;--accf:rgba(84,198,204,.16);--warn:#e8a25c;--warnf:rgba(232,162,92,.14)}}
text{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
.s{font-size:11.5px;fill:var(--mute)}.h{font-weight:600}.lab{font-size:11.5px;fill:var(--mute)}
.box{fill:var(--fill);stroke:var(--line);stroke-width:1.2}
.acc{fill:var(--accf);stroke:var(--acc);stroke-width:1.6}
.warn{fill:var(--warnf);stroke:var(--warn);stroke-width:1.6}
.zone{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--line);stroke-width:1.4}.lnw{fill:none;stroke:var(--warn);stroke-width:1.4}.lna{fill:none;stroke:var(--acc);stroke-width:1.6}
.dash{stroke-dasharray:4 3}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect class="box" x="20" y="40" width="70" height="56" rx="6"/>
<text class="h" x="55.0" y="72.5" text-anchor="middle">Issue</text>
<rect class="acc" x="120" y="40" width="120" height="56" rx="6"/>
<text class="h" x="180.0" y="65.0" text-anchor="middle">Is it work?</text>
<text class="s" x="180.0" y="81.0" text-anchor="middle">your labels</text>
<rect class="box" x="270" y="40" width="130" height="56" rx="6"/>
<text class="h" x="335.0" y="65.0" text-anchor="middle">Agent</text>
<text class="s" x="335.0" y="81.0" text-anchor="middle">edits, commits</text>
<rect class="acc" x="430" y="40" width="130" height="56" rx="6"/>
<text class="h" x="495.0" y="65.0" text-anchor="middle">Does it pass?</text>
<text class="s" x="495.0" y="81.0" text-anchor="middle">your checks</text>
<rect class="acc" x="590" y="40" width="140" height="56" rx="6"/>
<text class="h" x="660.0" y="65.0" text-anchor="middle">Do you approve?</text>
<text class="s" x="660.0" y="81.0" text-anchor="middle">or nobody</text>
<rect class="box" x="760" y="40" width="70" height="56" rx="6"/>
<text class="h" x="795.0" y="72.5" text-anchor="middle">Landed</text>
<path class="ln" d="M90 68.0 L120 68.0" marker-end="url(#a)"/>
<path class="ln" d="M240 68.0 L270 68.0" marker-end="url(#a)"/>
<path class="ln" d="M400 68.0 L430 68.0" marker-end="url(#a)"/>
<path class="ln" d="M560 68.0 L590 68.0" marker-end="url(#a)"/>
<path class="ln" d="M730 68.0 L760 68.0" marker-end="url(#a)"/>
<rect class="box" x="120" y="160" width="610" height="46" rx="6"/>
<text class="h" x="425.0" y="180.0" text-anchor="middle">recipe.yml</text>
<text class="s" x="425.0" y="196.0" text-anchor="middle">~/.lingtai/&lt;project&gt;/ — local to this machine, never committed</text>
<path class="lna dash" d="M180 160 L180 100" marker-end="url(#a)"/>
<path class="lna dash" d="M495 160 L495 100" marker-end="url(#a)"/>
<path class="lna dash" d="M660 160 L660 100" marker-end="url(#a)"/>
<text class="s" x="425" y="234" text-anchor="middle">Change the recipe and you change the gates; nothing in the repository moves.</text>
</svg>
