<circle class="dot" cx="449" cy="391" r="2.5"/>
<path class="wire" d="M449 463 C471 463, 483 400, 507 400" marker-end="url(#arrow)"/>
<circle class="dot" cx="449" cy="463" r="2.5"/>
<path class="wire wire-hold" d="M449 511 C471 511, 483 445, 507 445" marker-end="url(#arrow-hold)"/>
