<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵台报表原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root {
  /* board tokens (apps/board/src/app/globals.css): cool neutrals, teal is structure, amber means "waiting on you" */
  /* layout: the board's top bar, then a filter row, KPI row, a 2×2 chart grid and two tables */
  --ground: #f1f4f4; --surface: #ffffff; --surface-2: #e9eeee;
  --ink: #0f181c; --ink-2: #3a4a50; --muted: #5e6e74; --rule: #d8e0e1; --rule-2: #c3cfd1; --grid: #e4eaea;
  --accent: #0b6a70; --accent-soft: #dcedeD; --accent-ink: #075056;
  --pass: #2c7a4c; --pass-soft: #dfeee4; --fail: #a33029; --fail-soft: #f6e1de;
  /* chart categorical slots, validated (no amber, red or green: those are the board's states) */
  --s1: #2a78d6; --s2: #1baf7a; --s3: #6250d6; --s4: #e87ba4;
  --sans: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0c1316; --surface: #131e22; --surface-2: #182529;
    --ink: #dde6e8; --ink-2: #b4c2c6; --muted: #87999f; --rule: #22333a; --rule-2: #2d424a; --grid: #1a292e;
    --accent: #54c6cc; --accent-soft: #10312f; --accent-ink: #7fdade;
    --pass: #61be86; --pass-soft: #122c1e; --fail: #e2776e; --fail-soft: #331816;
    --s1: #3987e5; --s2: #199e70; --s3: #9085e9; --s4: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0c1316; --surface: #131e22; --surface-2: #182529;
  --ink: #dde6e8; --ink-2: #b4c2c6; --muted: #87999f; --rule: #22333a; --rule-2: #2d424a; --grid: #1a292e;
  --accent: #54c6cc; --accent-soft: #10312f; --accent-ink: #7fdade;
  --pass: #61be86; --pass-soft: #122c1e; --fail: #e2776e; --fail-soft: #331816;
  --s1: #3987e5; --s2: #199e70; --s3: #9085e9; --s4: #d55181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 13.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--mono); }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
.bar .brand { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; text-decoration: none; }
.bar .mark { width: 15px; height: 15px; border-radius: 2px; background: var(--accent); display: inline-block; }
.bar .sep { width: 1px; height: 14px; background: var(--rule-2); }
.bar a.nav { color: var(--muted); text-decoration: none; }
.bar a.nav.on { color: var(--ink); }
.bar .rail { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.chip { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--rule); color: var(--muted); }
main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 1280px; margin: 0 auto; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; background: var(--surface); }
.seg button { font: 12px var(--sans); background: none; border: 0; padding: 4px 11px; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.filters input[type=date] { font: 12px var(--mono); background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px; }
.kchip { font: 11.5px var(--sans); border: 1px solid var(--rule); background: var(--surface); color: var(--muted); border-radius: 2px; padding: 3px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.kchip.on { color: var(--ink); border-color: var(--rule-2); }
.kchip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.kchip:not(.on) i { opacity: .25; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--rule); border-left: 2px solid var(--rule-2); border-radius: 3px; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; }
.kpi.a-pass { border-left-color: var(--pass); } .kpi.a-fail { border-left-color: var(--fail); }
.kpi .k { color: var(--muted); font-size: 11.5px; }
.kpi .v { font: 600 22px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.kpi .s { color: var(--muted); font-size: 11.5px; }
.pill { font-family: var(--mono); font-size: 9.5px; padding: 1.5px 5px; border-radius: 2px; border: 1px solid var(--rule-2); color: var(--muted); white-space: nowrap; }
.pill.pass { color: var(--pass); border-color: var(--pass); background: var(--pass-soft); }
.pill.fail { color: var(--fail); border-color: var(--fail); background: var(--fail-soft); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.hlab { font-size: 10.5px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.panel h2 { font-size: 13.5px; margin: 0; font-weight: 600; }
.panel .sub { color: var(--muted); font-size: 11.5px; margin-top: -4px; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font: 10.5px var(--mono); }
svg .gl { stroke: var(--grid); stroke-width: 1; }
svg .ax { stroke: var(--rule-2); stroke-width: 1; }
svg .hit { fill: transparent; }
svg g.col:hover .hit { fill: var(--surface-2); }
.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--rule-2); border-radius: 3px; padding: 6px 9px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; z-index: 10; min-width: 140px; }
.tip b { display: block; margin-bottom: 3px; font-family: var(--mono); }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-family: var(--mono); }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 11px; font-family: var(--mono); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
td.t { max-width: 380px; }
td.t .why { color: var(--muted); font-size: 11.5px; }
td.t a { color: var(--ink); text-decoration: none; }
td.t a:hover { color: var(--accent-ink); text-decoration: underline; }
.kind { font-size: 11px; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); white-space: nowrap; }
.kind i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
table.xt td.cell { text-align: center; font-family: var(--mono); font-size: 12px; min-width: 64px; }
table.xt th.c { text-align: center; }
table.xt td.rl { color: var(--ink-2); white-space: nowrap; }
table.xt tr.tot td { border-top: 1px solid var(--rule-2); color: var(--muted); }
.empty { color: var(--muted); padding: 20px 0; text-align: center; font-size: 12px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="bar">
  <a class="brand" href="#"><span class="mark" aria-hidden="true"></span>lingtai</a>

      <div class="panel"><h2>每天花费</h2><div class="sub">窗口内所有票，含没合并的 · 按用途叠加</div><div class="legend" id="lg-purpose"></div><div id="c-spend"></div></div>
      <div class="panel" style="grid-column:1 / -1"><h2>为什么停下等人</h2><div class="sub">行是等待原因，列是 triage 的判断 · 颜色越深次数越多</div><div id="c-wait"></div></div>
    </section>

    <section class="panel">
      <h2>按类型</h2>
      <div class="tablewrap"><table id="t-kind"></table></div>
    </section>

    <section class="panel">
      <div class="phead"><h2>来回最多的票</h2>
        <div class="seg" id="sort"><button data-s="rounds" class="on">按轮数</button><button data-s="cost">按花费</button></div>
      </div>
      <div class="tablewrap"><table id="t-top"></table></div>
    </section>

function stacked(el, cats, series, seriesLabel, valueOf, fmt, labelEvery = 1) {
  const W = 520, H = 210, L = 38, R = 8, T = 10, B = 26;
  const totals = cats.map((c) => series.reduce((s, k) => s + valueOf(c, k), 0));
  const max = Math.max(1, ...totals);
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = (W - L - R) / cats.length, gap = Math.min(10, bw * 0.28);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top + 1e-9; v += step) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v, true)}</text>`;
  cats.forEach((c, i) => {
    const x = L + i * bw + gap / 2, w = bw - gap;
    let acc = 0, segs = '';
    const present = series.filter((k) => valueOf(c, k) > 0);
    present.forEach((k, j) => {
      const v = valueOf(c, k), y0 = y(acc), y1 = y(acc + v), h = Math.max(0, y0 - y1 - (j < present.length - 1 ? 2 : 0));
      const isTop = j === present.length - 1, r = isTop ? Math.min(4, w / 2, h) : 0;
      segs += isTop ? `<path d="M${x},${y0}V${y1 + r}q0,${-r} ${r},${-r}H${x + w - r}q${r},0 ${r},${r}V${y0}Z" fill="${sv(series.indexOf(k) < 5 ? seriesIdx(series, k) : 0)}"/>` : `<rect x="${x}" y="${y0 - h}" width="${w}" height="${h}" fill="${sv(seriesIdx(series, k))}"/>`;
      acc += v;
    });
    const tipHtml = `<b>${c}</b>` + series.filter((k) => valueOf(c, k) > 0).map((k) => `<div class="r"><span><i style="background:${sv(seriesIdx(series, k))}"></i>${seriesLabel[k]}</span><span>${fmt(valueOf(c, k))}</span></div>`).join('') + `<div class="r" style="border-top:1px solid var(--line);margin-top:3px;padding-top:3px"><span>合计</span><span>${fmt(totals[i])}</span></div>`;
    s += `<g class="col" data-tip="${encodeURIComponent(tipHtml)}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>${segs}</g>`;
    if (i % labelEvery === 0 || i === cats.length - 1) s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${c.length > 5 ? c.slice(5) : c}</text>`;
  });

  el.innerHTML = s;

}
const seriesIdx = (series, k) => (series === KINDS ? KINDS.indexOf(k) : PURPOSES.indexOf(k));
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

function passChart(el) {

  const K = 7;

  DATA.filter((r) => state.kinds.has(r.kind) && r.reviews.length).forEach((r) => {

    const first = day(rv[0][2]); if (first < a || first > b) return;
    const k = rv.findIndex((x) => x[1] === 0);

  if (!seqs.length) { el.innerHTML = '<div class="empty">窗口内没有开始 review 的票</div>'; return; }
  let S = 1; const pts = [{ k: 0, s: 1, risk: seqs.length, passed: 0 }];
  for (let k = 1; k <= K; k++) {
    const risk = seqs.filter((q) => (q.passedAt === null ? q.n >= k : q.passedAt >= k)).length;
    const passed = seqs.filter((q) => q.passedAt === k).length;
    if (risk) S *= 1 - passed / risk;
    pts.push({ k, s: S, risk, passed });
    if (!risk) break;
  }
  const W = 520, H = 210, L = 38, R = 30, T = 14, B = 26;
  const x = (k) => L + ((W - L - R) * k) / K, y = (v) => T + (H - T - B) * (1 - v);

  for (let k = 0; k <= K; k++) s += `<text x="${x(k)}" y="${H - 8}" text-anchor="middle">${k}</text>`;
  let d = `M${x(0)},${y(1)}`;

  pts.forEach((p) => {

    s += `<g class="col" data-tip="${encodeURIComponent(tip)}"><rect class="hit" x="${x(p.k) - 18}" y="${T}" width="36" height="${H - T - B}"/><circle cx="${x(p.k)}" cy="${y(p.s)}" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;

  const buckets = ['0', '1', '2', '3', '4', '5+'];
  const bOf = (r) => (r.rounds >= 5 ? '5+' : String(r.rounds));
  stacked(document.getElementById('c-dist'), buckets, KINDS, KIND_ZH, (c, kk) => landed.filter((r) => r.kind === kk && bOf(r) === c).length, (v) => String(Math.round(v)));
  passChart(document.getElementById('c-pass'));
  const ds = days(), every = ds.length > 10 ? Math.ceil(ds.length / 8) : 1;
  stacked(document.getElementById('c-day'), ds, KINDS, KIND_ZH, (c, kk) => landed.filter((r) => r.kind === kk && day(r.at) === c).length, (v) => String(Math.round(v)), every);
  stacked(document.getElementById('c-spend'), ds, PURPOSES, PURPOSE_ZH, (c, p) => rs.filter((r) => day(r.at) === c).reduce((s, r) => s + Object.entries(r.cost).filter(([q]) => purposeOf(q) === p).reduce((a, [, v]) => a + v, 0), 0), (v, axis) => (axis ? '$' + Math.round(v) : money(v)), every);

  const pairs = {}, causesSeen = new Set();
  rs.forEach((r) => r.pairs.forEach(([w, c]) => { const cc = c ?? 'none'; causesSeen.add(cc); (pairs[w] ??= {})[cc] = (pairs[w][cc] ?? 0) + 1; }));
  const cols = ['FixableLines', 'UndecidedQuestion', 'ConflictingHunks', 'SetupBroken', 'none'].filter((c) => causesSeen.has(c));
  const wrows = Object.keys(pairs).sort((x, y) => Object.values(pairs[y]).reduce((a, b) => a + b, 0) - Object.values(pairs[x]).reduce((a, b) => a + b, 0));
  const maxCell = Math.max(1, ...wrows.flatMap((w) => cols.map((c) => pairs[w][c] ?? 0)));
  const shade = (v) => (v ? `background:color-mix(in oklab, var(--accent) ${Math.round(12 + 70 * (v / maxCell))}%, var(--surface));color:${v / maxCell > 0.55 ? 'var(--surface)' : 'var(--ink)'}` : 'color:var(--rule-2)');
  const colTot = (c) => wrows.reduce((s, w) => s + (pairs[w][c] ?? 0), 0);
  document.getElementById('c-wait').innerHTML = wrows.length ? `<div class="tablewrap"><table class="xt"><thead><tr><th>等待原因 ＼ triage</th>${cols.map((c) => `<th class="c">${CAUSE_ZH[c] ?? c}</th>`).join('')}<th class="num">合计</th></tr></thead><tbody>${wrows.map((w) => `<tr><td class="rl">${WAIT_ZH[w] ?? w}</td>${cols.map((c) => `<td class="cell" style="${shade(pairs[w][c] ?? 0)}">${pairs[w][c] ?? '·'}</td>`).join('')}<td class="num">${Object.values(pairs[w]).reduce((a, b) => a + b, 0)}</td></tr>`).join('')}<tr class="tot"><td>合计</td>${cols.map((c) => `<td class="cell">${colTot(c)}</td>`).join('')}<td class="num">${cols.reduce((s, c) => s + colTot(c), 0)}</td></tr></tbody></table></div>` : '<div class="empty">窗口内没有等待</div>';

  const kindRows = KINDS.filter((kk) => state.kinds.has(kk)).map((kk) => {
    const l = landed.filter((r) => r.kind === kk), rr = l.map((r) => r.rounds), f = l.filter((r) => r.rounds >= 5).length;
    const spent = rs.filter((r) => r.kind === kk).reduce((s, r) => s + cost(r), 0);
    return `<tr><td><span class="kind"><i style="background:${sv(KINDS.indexOf(kk))}"></i>${KIND_ZH[kk]}</span></td><td class="num">${l.length}</td><td class="num">${isNaN(median(rr)) ? '—' : median(rr)}</td><td class="num">${pct(l.filter((r) => r.rounds <= 1).length, l.length)}</td><td class="num">${pct(f, l.length)}</td><td class="num">${l.length ? money(l.reduce((s, r) => s + cost(r), 0) / l.length) : '—'}</td></tr>`;
  });
  document.getElementById('t-kind').innerHTML = `<thead><tr><th>类型</th><th class="num">合并</th><th class="num">中位轮数</th><th class="num">0–1 轮</th><th class="num">≥5 轮</th><th class="num">每张平均花费</th></tr></thead><tbody>${kindRows.join('')}</tbody>`;

  const top = [...rs].sort((a, b) => (state.sort === 'rounds' ? b.rounds - a.rounds || cost(b) - cost(a) : cost(b) - cost(a))).slice(0, 8);
  const why = (r) => {
    const c = cost(r); if (!c) return '';
    const [p, v] = Object.entries(r.cost).sort((a, b) => b[1] - a[1])[0];
    const w = {}; r.waits.forEach((x) => (w[x] = (w[x] ?? 0) + 1));
    const ws = Object.entries(w).map(([kk, n]) => `${WAIT_ZH[kk] ?? kk}${n > 1 ? ' ×' + n : ''}`).join('、');
    return `${Math.round((100 * v) / c)}% 花在${PURPOSE_ZH[purposeOf(p)].replace(/（.*）/, '')}上 · ${r.rounds} 轮修复 · ${r.passes} 遍${r.waits.length ? ` · 等待 ${r.waits.length} 次（${ws}）` : ''}`;
  };
  document.getElementById('t-top').innerHTML = top.length ? `<thead><tr><th>票</th><th>类型</th><th class="num">轮数</th><th class="num">遍数</th><th class="num">花费</th><th class="num">机器时间</th><th>结果</th></tr></thead><tbody>${top.map((r) => `<tr><td class="t"><div class="title"><a href="#">#${r.n} ${(r.title.length > 90 ? r.title.slice(0, 88) + '…' : r.title).replace(/</g, '&lt;')}</a></div><div class="why">${why(r)}</div></td><td><span class="kind"><i style="background:${sv(KINDS.indexOf(r.kind))}"></i>${KIND_ZH[r.kind]}</span></td><td class="num">${r.rounds}${r.rounds >= 5 ? `<span class="bar5" style="width:${Math.min(40, r.rounds * 2)}px" title="≥5 轮"></span>` : ''}</td><td class="num">${r.passes}</td><td class="num">${money(cost(r))}${r.unknown ? ` +${r.unknown}?` : ''}</td><td class="num">${r.machineMin} 分</td><td>${{ landed: '合并', closed: '关闭', open: '未完成' }[r.outcome]}</td></tr>`).join('')}</tbody>` : '<tbody><tr><td class="empty">窗口内没有票</td></tr></tbody>';
}

document.getElementById('kinds').innerHTML = KINDS.map((kk, i) => `<button class="kchip on" data-k="${kk}" aria-pressed="true"><i style="background:${sv(i)}"></i>${KIND_ZH[kk]}</button>`).join('');
document.getElementById('kinds').addEventListener('click', (e) => { const b = e.target.closest('.kchip'); if (!b) return; const kk = b.dataset.k; if (state.kinds.has(kk) && state.kinds.size > 1) state.kinds.delete(kk); else state.kinds.add(kk); b.classList.toggle('on', state.kinds.has(kk)); b.setAttribute('aria-pressed', state.kinds.has(kk)); render(); });
document.getElementById('win').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.win = b.dataset.w; document.querySelectorAll('#win button').forEach((x) => x.classList.toggle('on', x === b)); render(); });
[d0, d1].forEach((i) => i.addEventListener('change', () => { state.win = 'range'; document.querySelectorAll('#win button').forEach((x) => x.classList.toggle('on', x.dataset.w === 'range')); render(); }));
document.getElementById('sort').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.sort = b.dataset.s; document.querySelectorAll('#sort button').forEach((x) => x.classList.toggle('on', x === b)); render(); });
legend('lg-kind1', KINDS, KIND_ZH, (kk) => KINDS.indexOf(kk));
legend('lg-kind2', KINDS, KIND_ZH, (kk) => KINDS.indexOf(kk));
legend('lg-purpose', PURPOSES, PURPOSE_ZH, (p) => PURPOSES.indexOf(p));
render();
</script>
</body>
</html>
