<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" role="img" aria-label="Lingtai runs on your machine: it reads your labelled GitHub issues, records events in Postgres, and merges back through the GitHub App.">
<style>
:root{--fg:#0f181c;--mute:#51636a;--line:#8aa0a6;--fill:rgba(11,106,112,.06);--acc:#0b6a70;--accf:rgba(11,106,112,.14);--warn:#a4540a;--warnf:rgba(164,84,10,.12)}
@media (prefers-color-scheme:dark){:root{--fg:#dde6e8;--mute:#93a7ad;--line:#5d757b;--fill:rgba(84,198,204,.07);--acc:#54c6cc;--accf:rgba(84,198,204,.16);--warn:#e8a25c;--warnf:rgba(232,162,92,.14)}}
text{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
.s{font-size:11.5px;fill:var(--mute)}.h{font-weight:600}.lab{font-size:11.5px;fill:var(--mute)}
.box{fill:var(--fill);stroke:var(--line);stroke-width:1.2}
.acc{fill:var(--accf);stroke:var(--acc);stroke-width:1.6}
.warn{fill:var(--warnf);stroke:var(--warn);stroke-width:1.6}
.zone{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--line);stroke-width:1.4}.lnw{fill:none;stroke:var(--warn);stroke-width:1.4}.lna{fill:none;stroke:var(--acc);stroke-width:1.6}
.dash{stroke-dasharray:4 3}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect class="zone" x="10" y="10" width="190" height="310" rx="10"/>
<text class="s h" x="24" y="30">GitHub</text>
<rect class="box" x="26" y="50" width="158" height="52" rx="6"/>
<text class="h" x="105.0" y="73.0" text-anchor="middle">Issues</text>
<text class="s" x="105.0" y="89.0" text-anchor="middle">your labels decide</text>
<rect class="box" x="26" y="120" width="158" height="52" rx="6"/>
<text class="h" x="105.0" y="143.0" text-anchor="middle">Repository</text>
<text class="s" x="105.0" y="159.0" text-anchor="middle">base branch</text>
<rect class="box" x="26" y="190" width="158" height="52" rx="6"/>
<text class="h" x="105.0" y="213.0" text-anchor="middle">GitHub App</text>
<text class="s" x="105.0" y="229.0" text-anchor="middle">lets Lingtai act</text>
<rect class="zone" x="270" y="10" width="460" height="310" rx="10"/>
<text class="s h" x="284" y="30">Your machine</text>
<rect class="acc" x="310" y="84" width="170" height="76" rx="6"/>
<text class="h" x="395.0" y="119.0" text-anchor="middle">lingtai start</text>
<text class="s" x="395.0" y="135.0" text-anchor="middle">claims, checks, merges</text>
<rect class="box" x="310" y="226" width="170" height="62" rx="6"/>
<text class="h" x="395.0" y="254.0" text-anchor="middle">~/.lingtai</text>
<text class="s" x="395.0" y="270.0" text-anchor="middle">recipe · config · env</text>
<rect class="box" x="550" y="50" width="160" height="56" rx="6"/>
<text class="h" x="630.0" y="75.0" text-anchor="middle">Agent runtime</text>
<text class="s" x="630.0" y="91.0" text-anchor="middle">Claude Code or Codex</text>
<rect class="box" x="550" y="130" width="160" height="56" rx="6"/>
<text class="h" x="630.0" y="155.0" text-anchor="middle">Postgres</text>
<text class="s" x="630.0" y="171.0" text-anchor="middle">Lingtai's own log</text>
<rect class="box" x="550" y="210" width="160" height="56" rx="6"/>
<text class="h" x="630.0" y="235.0" text-anchor="middle">Board</text>
<text class="s" x="630.0" y="251.0" text-anchor="middle">127.0.0.1:17820</text>
<path class="ln" d="M184 76 L240 76 L240 104 L310 104" marker-end="url(#a)"/>
<text class="lab" x="190" y="66" text-anchor="start">labelled issues</text>
<path class="ln" d="M310 140 L240 140 L240 146 L184 146" marker-end="url(#a)"/>
<text class="lab" x="247" y="162" text-anchor="middle">branch, merge</text>
<path class="ln" d="M480 104 L515 104 L515 78 L550 78" marker-end="url(#a)"/>
<text class="lab" x="498" y="70" text-anchor="middle">runs</text>
<path class="ln" d="M480 140 L515 140 L515 158 L550 158" marker-end="url(#a)"/>
<text class="lab" x="498" y="182" text-anchor="middle">appends</text>
<path class="ln" d="M630 186 L630 210" marker-end="url(#a)"/>
<text class="lab" x="638" y="203" text-anchor="start">reads</text>
<path class="ln dash" d="M395 226 L395 160" marker-end="url(#a)"/>
<text class="lab" x="403" y="200" text-anchor="start">read each pass</text>
</svg>
