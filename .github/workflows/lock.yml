# The lock, on a Mac — the macOS half of both platforms 1.0 ships (#193).
#
# #178's attempt 1 locked through SQLite's `unix-flock` VFS, which is compiled
# in only on Apple's builds: its tests passed on the Mac they were written on and
# the locker threw on Linux. So the tests that prove the lock — the contract, a
# killed holder, the queue `service shutdown` waits in — run on both platforms
# rather than wherever somebody happens to work. The Linux half is
# `integration.yml`, which runs this file with the rest of the integration
# project, so this workflow no longer repeats it on Linux.
#
# One Node, `.node-version`'s (#430) — `engines` names the same Node this
# repository runs everywhere else, so there is no second Node to prove the lock
# against.
#
# No database: the lock needs none. It is an `integration` test all the same —
# it spawns holders and writes lock files, and both are outside the system
# (0060 §1) — so the project named here is `integration` and not `unit` (#225).
name: lock

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the lock contract, a killed holder, and the queue's order
        run: pnpm exec vitest run --project integration packages/daemon/integration/file-lock.test.ts
