# The lock, on both platforms 1.0 ships (#193).
#
# #178's attempt 1 locked through SQLite's `unix-flock` VFS, which is compiled
# in only on Apple's builds: its tests passed on the Mac they were written on and
# the locker threw on Linux. So the tests that prove the lock — the contract, a
# killed holder, the queue `service shutdown` waits in — run on Linux here, and
# on a Mac beside it, rather than wherever somebody happens to work.
#
# And on two Nodes: the floor `engines` names, where `node:sqlite` first loads
# without a flag and the constructor's `timeout` does not exist yet, and a
# current one. The lock written against the second threw on the first.
#
# No database: the lock needs none. It is an `integration` test all the same —
# it spawns holders and writes lock files, and both are outside the system
# (0060 §1) — so the project named here is `integration` and not `unit` (#225).
name: lock

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
        node: [22.13.0, 26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the lock contract, a killed holder, and the queue's order
        run: pnpm exec vitest run --project integration packages/daemon/integration/file-lock.test.ts
