# The binary, four times (#185, 0050).
#
# SEA copies the Node that builds it, so each artifact is built on the platform
# it is for and never cross-compiled — and each is *run* there, because a binary
# nobody executed is not a binary that works. `apps/release`'s test builds the
# bundle and the binary, starts the board from each, and on macOS proves the
# binary is signed and that it is `buildBinary`'s signing step that signs it.
#
# A tag `v*` publishes: the four binaries, the one board (pure JavaScript, the
# same everywhere), and SHA256SUMS over all of them.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # `node --build-sea` is 25.5 and later; the binary carries this Node.
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: pnpm install --frozen-lockfile

      - name: build, run and serve a page — the bundle and the binary
        run: pnpm exec vitest run --project integration apps/release/integration/build.test.ts

      - name: build the artifact
        run: pnpm build && pnpm binary

      - name: run the artifact itself, and check it is the platform it is named for
        env:
          # `lingtai` loads the event store at import; nothing connects for `version`.
          LINGTAI_DATABASE_URL: postgres://127.0.0.1:1/none
        run: |
          line="$(dist/lingtai version)"
          echo "$line"
          case "$line" in
            *" ${{ matrix.platform }} (binary,"*) ;;
            *) echo "expected ${{ matrix.platform }}, a binary"; exit 1 ;;
          esac
          # A tag publishes, so the binary has to say the tag's version: the
          # version is the root `package.json`'s, compiled in, and nothing else
          # would notice a tag pushed without bumping it.
          if [ "${{ github.ref_type }}" = tag ]; then
            case "$line" in
              "lingtai ${GITHUB_REF_NAME#v} ${{ matrix.platform }} (binary,"*) ;;
              *) echo "tag $GITHUB_REF_NAME, but the binary says: $line — set package.json's version to ${GITHUB_REF_NAME#v} and tag again"; exit 1 ;;
            esac
          fi

      - name: pack
        run: |
          mkdir -p artifacts
          tar -czf artifacts/lingtai-${{ matrix.platform }}.tar.gz -C dist lingtai packages prompts
          # `board/` is identical on every platform; one copy is published.
          if [ "${{ matrix.platform }}" = linux-x64 ]; then
            tar -czf artifacts/board.tar.gz -C dist board
            # The installer itself, published beside what it installs — the one
            # address for it that cannot move. A domain serving it can lapse,
            # be renamed, or answer a bot challenge with a 200 HTML page that
            # `curl -f` does not catch and `sh` then runs. Same file the site
            # serves at /install.sh, byte for byte; it lands in SHA256SUMS
            # below, which is harmless — the script looks up only the names it
            # fetched, and it never fetches itself.
            cp apps/site/public/install.sh artifacts/install.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lingtai-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: CLI contract diff
        # doc/cli.json is generated and carries no stamp (#545), so a plain diff
        # against the previous tag is the change to the command line.
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${{ github.ref_name }}^" 2>/dev/null || true)
          {
            echo "## CLI contract"
            echo
            if [ -z "$prev" ]; then
              echo "No earlier release to compare \`doc/cli.json\` with."
            elif git diff --quiet "$prev" "${{ github.ref_name }}" -- doc/cli.json; then
              echo "No change to the command line since $prev."
            else
              echo "Changes to the command line since $prev (\`git diff $prev..${{ github.ref_name }} -- doc/cli.json\`):"
              echo
              echo '```diff'
              git diff "$prev" "${{ github.ref_name }}" -- doc/cli.json
              echo '```'
            fi
            echo
          } > cli-contract.md
          cat cli-contract.md
      - name: Events manifest and what changed
        # Not `pnpm events:generate`: pnpm would hand `--ref` to the oxfmt that
        # follows it in that script. The asset needs no formatting. The asset is
        # in artifacts/ before checksums, so SHA256SUMS covers it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node packages/domain/scripts/events.ts --ref "${{ github.ref_name }}"
          cp doc/events.json artifacts/events.json
          # The previous release is the highest-versioned tag below this one that
          # has a published release, whether or not it is an ancestor (a release
          # branch's tag counts) and whatever happened to the tags in between: a
          # tag whose publish failed has no release and is passed over. Every gh
          # call is an assignment, so a failed lookup fails the step (-e) instead
          # of reading as "no earlier manifest".
          published=$(gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName --jq '.[].tagName')
          tags=$(git tag --list 'v*' --sort=-v:refname)
          prev=
          seen=
          for t in $tags; do
            if [ "$t" = "${{ github.ref_name }}" ]; then
              seen=1
            elif [ -n "$seen" ] && printf '%s\n' "$published" | grep -qx "$t"; then
              prev=$t
              break
            fi
          done
          old=
          if [ -n "$prev" ]; then
            assets=$(gh release view "$prev" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          else
            assets=
          fi
          # Only a published release that lists no events.json means no earlier
          # manifest; a failed download must fail the step, not publish "first release".
          if printf '%s\n' "$assets" | grep -qx events.json; then
            mkdir previous
            gh release download "$prev" --repo "${{ github.repository }}" --pattern events.json --dir previous
            old=previous/events.json
          fi
          node packages/domain/scripts/events-diff.ts $old artifacts/events.json $prev > events-changed.md
          cat events-changed.md
          cat cli-contract.md events-changed.md > release-notes.md
      - name: checksums
        working-directory: artifacts
        # `shasum -a 256 -c SHA256SUMS` on a Mac, `sha256sum -c` on Linux.
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file release-notes.md --generate-notes
