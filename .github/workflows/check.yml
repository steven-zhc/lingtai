# The unit half, the formatter and the linter, on every PR and every push to
# main (#365, #367, #366).
#
# This is the gate that only ran inside the conductor's own `build:` step —
# visible on this repository's copy of the recipe, but since #180 nothing
# reads that copy, so it covered the conductor's own tickets and nothing a
# person or a Claude session opened as a PR (#364 was one). This workflow is
# that second witness.
#
# It is the unit project only (0060 §1), never `pnpm test:integration`: that
# half takes 803s and belongs to T11, after the merge lane lands on the studio
# branch, on the PR into main, and again on the push to main, on a separate
# system: `integration.yml` is that system (#963, #1403).
# No `LINGTAI_*` secret goes anywhere near this workflow.
#
# It is deliberately not a GitHub-required status check on the studio branch.
# The merge lane does not land through a PR there — it is `git merge --no-edit`
# into the base and a push (`packages/actions/src/merge-action.ts:47`) — so a
# required check would refuse every landing the conductor makes. In team mode
# `main` moves only by a PR, and what that PR waits on is Lingtai's own CI step,
# `pr.ci.required` in the conducting recipe, not a branch-protection rule.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--check` and never a bare `oxfmt`: with no flag it writes files in
      # place, so a formatter in CI would report success having changed the
      # checkout rather than having found it correct (#367).
      - name: fmt
        run: pnpm fmt:check
      # `--deny-warnings` is in the script, and it is the whole of the gate:
      # without it a warning count only ever goes up (#366).
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
        env:
          HOME: /nonexistent
