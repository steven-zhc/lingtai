name: Feature request
description: Propose a change.
labels: [feature, agent:hold]
body:
  - type: markdown
    attributes:
      value: |
        A person reads this before anything is worked on. Say what fails, not
        which area it is in. For a vulnerability or a conduct concern, use the
        "Private contact" form instead and put no details in a public issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "One sentence: what is missing or hard, as a failure."
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: Want
      description: What is true when this is done.
    validations:
      required: true
  - type: textarea
    id: watch-out
    attributes:
      label: Watch out
      description: The trap. What costs money, fails silently, or has been got wrong before. Write "none known" if there is none.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Anything that shows the need: output, a link, a case that goes wrong today."
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Checkboxes that a person or a test can check.
      placeholder: "- [ ] ..."
