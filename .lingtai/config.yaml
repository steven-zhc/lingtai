# How Lingtai works on Lingtai.
#
# Read from origin/main, never from the branch an agent is working on. That rule
# ([0005](../doc/decisions/0005-config-in-target-repo.md)) is what makes it safe
# to keep this file in the repository the agent edits: an agent that changes it
# changes nothing about the run in flight.
#
# It matters more here than anywhere else, because here the agent is editing the
# conductor that is running it. Three different versions of this code are in play
# during a run and it is worth being explicit about which is which:
#
#   the running conductor   ~/workspace/lingtai, modules already loaded — OLD
#   the agent's worktree    ~/.lingtai/worktrees/lingtai/<runId>       — NEW
#   the mirror              ~/.lingtai/repos/lingtai.git @ origin/main — BASE
#
# So the machinery judging the change is the old code, and the thing being
# judged is the new code. That is the same separation GitHub Actions gets by
# reading a workflow from the base branch, and here it is free: the process was
# already running before the change existed.
version: 1

repo:
  base: main
  submodules: false

source:
  kinds: [bug, tech-debt, feature]

  # `agent:hold` is on every open issue right now, deliberately. Self-hosting
  # starts with nothing runnable and one ticket unheld at a time, because the
  # backlog contains work no agent should take — #29 needs seven unattended days,
  # #33 is the act of self-hosting itself.
  exclude:
    - blocked
    - in-progress
    - agent:hold
    - agent:blocked
    - agent:needs-schema-approval
    - agent:review
    - agent:wip
    # An epic is a table of contents, not work. `#126` was claimed on
    # 2026-09-10, spent a full pass and a repair on a body with no code in it,
    # and blocked on a test suite it had no way to satisfy.
    #
    # **Named rather than hidden.** The first fix was to take its kind label
    # away, which works — the queue only sees an issue the recipe has a kind
    # for — and it makes the reason an *absence*: the epic counts under
    # `no-kind` beside genuine miscategorisations, and it stops rendering as the
    # kind of work it is. Excluding it by name keeps its `feature`, keeps its
    # colour, and says why it is passed over. Same argument as 0016 §4, and the
    # same one `recipe.ts:172` makes about this list being the *only* reason an
    # issue is passed over for its labels.
    - epic

  # How long a failed attempt keeps its own ticket out of the queue
  # ([0028](../doc/decisions/0028-the-backoff-is-the-recipes.md)).
  #
  # Written out rather than left to the default, for the reason `repair` is:
  # this is the repository that has to be able to read its own policy without
  # opening its own source. An hour is the default and the right number here —
  # self-hosting runs one unheld ticket at a time, so a ticket that fails and
  # comes straight back is the whole queue.
  backoff: 1h

env:
  # The test database, and nothing else.
  #
  # The suite refuses to run without LINGTAI_TEST_DATABASE_URL, and every test
  # appends real events — so an agent needs it. What an agent must never have is
  # LINGTAI_DATABASE_URL: that is this system's own log, the thing it is
  # keeping. Naming only these two is what keeps them apart.
  #
  # `required` is a *check*, not a filter: naming a variable here says this
  # repository needs one, and a run that cannot supply it refuses the whole
  # project before it claims anything. `allow` and `deny` are the filters, and
  # this recipe sets neither — so the two files' contents reach the agent, minus
  # anything that is Lingtai's own ([0021](../doc/decisions/0021-the-recipe-decides-the-environment.md), #60).
  #
  # The names carry `LINGTAI_` since #63, and that prefix is doing the work the
  # old `TEST_*`/RESERVED asymmetry used to. No managed application asks for a
  # LINGTAI_* name, so a project whose own file is missing a line gets an
  # *absent* value — which `required` refuses loudly — instead of silently
  # inheriting Lingtai's.
  required:
    - LINGTAI_TEST_DATABASE_URL
    - LINGTAI_TEST_DIRECT_DATABASE_URL
  # `@lingtai/env` loads `.env.local` from the workspace root, so that is where
  # a worktree's copy has to land.
  plantAt: .env.local

gates:
  admit: []

  # `git worktree add` copies no node_modules, and this repository's own tests
  # are what the `proposed` gate runs.
  prepared:
    - name: install
      run: pnpm install --frozen-lockfile
      timeout: 10m
      env: []

  proposed:
    # `env: []` is written out rather than left to the default, for the reason
    # `backoff` and `repair` are: this is the repository that has to be able to
    # read its own policy without opening its own source. A `run:` action is an
    # extension ([0037](../doc/decisions/0037-an-extension-is-a-command.md) §1),
    # and what it declares is every credential its process gets.
    #
    # **Nothing, and the suite still runs.** It refuses to start without
    # LINGTAI_TEST_DATABASE_URL, and it reads it from the `.env.local` this run
    # planted in the worktree (`env.plantAt` above), not from its environment.
    # That is also why it could not be declared here if it wanted to be: an
    # extension may not name one of Lingtai's own.
    - name: build
      run: pnpm typecheck && pnpm test
      timeout: 20m
      env: []

    # The cold reviewer, on from 2026-09-09. It is second deliberately: the
    # first refusal wins and the rest do not run, so a diff that does not
    # compile is never paid to be reviewed.
    #
    # **This closes the gap `merge: []` opened and named.** That comment says
    # what is now the only thing between an agent and `main` is `proposed` —
    # "it is not a person reading a diff". It still is not. It is a reviewer
    # that did not write the change and does not know what anyone concluded,
    # which [experiment 001](../doc/experiments/001-cold-review-issue-58.md)
    # measured against four defects that had already survived self-review, CI
    # and a full human read: it found all four in one finding, plus two nobody
    # had found.
    #
    # The rubric, the checklist and the JSON contract are fixed in
    # `agent-gate.ts` and cannot be removed from here — this text is appended.
    # What belongs here is only what *this* repository keeps getting wrong.
    - name: review
      agent: |
        This is an event-sourced scheduler that schedules its own development.
        Six shapes have produced real defects here. Look for them as well as the
        checklist above.

        1. **A comment that was true when it was written and is false now.**
           This repository's signature defect: it appeared six times in a single
           session. A lease duration that no longer exists; a `reconcile`
           described as running only at startup; a justification resting on
           "every merge already waits for a person" written after merges stopped
           waiting. Ask of every comment, doc line and ADR sentence near a
           behavioural change: does it still describe what the code now does?
           A stale claim is a finding, and its failure scenario is the next
           reader who believes it and acts on it.

        2. **A check that is present, reported, and not looking at the thing you
           think it is.** `#58`: the `merge` point renders as resolved and
           executes nothing. `#89`: `runtime.limits.turns` was declared in the
           recipe, carried through three layers, and handed to no runtime. Ask
           of any check the diff adds or touches: what exact input does it read,
           and is that input the thing its name claims? A check that cannot fail
           is worse than no check, because it is believed.

        3. **A guarantee that holds only because the single implementation is
           careful.** `work-loop.ts` invokes a subscriber with no `.catch` and
           depends on that subscriber never rethrowing. Ask whether the
           invariant would survive a second implementation written by somebody
           who had not read the first.

        4. **A projection that is not a pure fold.** A reducer may read the
           event and nothing else — no clock, no network, no environment.
           Anything time-dependent makes `lingtai projection rebuild` disagree
           with the live fold, and the two disagreeing silently is the failure.

        5. **A required field added to a shared type, with a hand-written
           literal missed.** `#89`'s first attempt added a field to
           `RuntimeCapabilities` and missed a literal in a package the change
           never opened. For every widened type: where else is this constructed
           by hand?

        6. **A name Lingtai reads for itself without the `LINGTAI_` prefix**
           (`#63`) — or a project's own variable wrongly given one. A project's
           file keeps its own names.

    # **Written down and not on.** Drafted 2026-09-10, left commented because
    # the half it belongs to is not decided yet — see below.
    #
    # `watch:` asks a question `review:` does not. Review asks *is this diff
    # wrong*; this asks *does this diff introduce something a person must see,
    # whether or not it is wrong*. They are independent and both have to be able
    # to hold: a change that adds a migration wants a person even when every
    # gate passes, and a change the reviewer refuses that touches none of this
    # wants an agent, not a queue of one.
    #
    # Today they are one path — a gate refuses, the item blocks, a person
    # decides — which is why on 2026-09-10 the three items waiting were the
    # three whose fixes were least in doubt.
    #
    # **Why these paths.** "A new concept needs a person" reads as
    # uncomputable, and in this repository it is not: concepts have addresses.
    # A type exported from `domain`, a key in the recipe schema, a port on the
    # conductor — each is a new noun somebody will have to learn. A migration is
    # the same argument about data, and `integrate.ts` already refuses those
    # separately, later, with less to say about it.
    #
    # **What it does not catch is content.** A new endpoint added to a file that
    # already exists is a new API and no glob sees it. That needs a condition on
    # the diff's added lines, which nothing here can express yet.
    #
    # - name: a person sees a new noun
    #   watch:
    #     - "packages/domain/src/**"
    #     - "packages/recipe/src/recipe.ts"
    #     - "packages/conductor/src/ports.ts"
    #     - "**/migrations/**"
    #     - "**/schema.prisma"
    #   then: request-approval

  # Nothing holds here any more, and this is the moment the previous version of
  # this comment named: "when being asked every time becomes the annoyance
  # rather than the point". On 2026-09-08 seven changes landed and every one was
  # approved unread-in-substance, which is an approval that has stopped meaning
  # anything.
  #
  # **What is now the only thing between an agent and `main` is `proposed`** —
  # `pnpm typecheck && pnpm test`, green. That is a real gate and it has caught
  # real failures today; it is not a person reading a diff.
  #
  # `#31`'s `watch:` list over packages/conductor, event-store, hook and actions
  # is still the narrowing to reach for if this turns out to be too far. The old
  # comment's objection to it stands — a path list has to be kept correct, and
  # the first thing it would miss is the file that defines it — so if it comes
  # back it should be tried against that objection, not around it.
  merge: []

  end:
    - name: close the ticket
      when: landed
      close: true

runtime:
  agent: claude-code
  # Lower than admin's 300. A change here is meant to be small enough to read in
  # one sitting; a run that needs hundreds of turns on this repository is a
  # ticket that was scoped wrong, and stopping is the more useful answer.
  limits:
    turns: 150
    wall: 1h

    # How many times a pass sends the agent back, carrying what refused it
    # ([0039](../doc/decisions/0039-the-worktree-is-the-whole-of-a-pass.md) §3).
    #
    # Written out rather than left to the default, because this is the
    # repository that has to be able to read its own policy without opening its
    # own source — and because the number is a deliberate one here.
    #
    # **Three, and the number is a hypothesis about what a refusal means.**
    #
    # Two was the first value and ten was an afternoon's experiment; three is
    # what [011](../doc/experiments/011-patching-versus-starting-over.md) argues
    # for. That experiment ran `#144` both ways against the same cold reviewer:
    # patching across two rounds refused three times, cost ~$12 and landed
    # nothing, while starting over carrying those findings passed first read for
    # $6.56 — **using none of the ten rounds it had.**
    #
    # What the three refusals had in common is the point. Each was about the
    # code the round before it had written; the last was a deadlock that did not
    # exist until the round before created it. A round buys another attempt at
    # *this approach*, so when the approach is the defect every round pays to
    # get further away, and the ceiling's only contribution is deciding when to
    # stop paying.
    #
    # **So three is a reading of the signal rather than a budget.** One refusal
    # is an ordinary finding. Two is a fix that missed. By the third the pattern
    # — a reviewer refusing what the last round wrote — is legible, and the
    # honest conclusion is that the approach is wrong and the money belongs in a
    # fresh start rather than a fourth patch. Raising it past three buys more of
    # a thing this project has watched fail; lowering it to two stops before the
    # pattern is readable.
    #
    # Taking that conclusion automatically is `restarts` below
    # ([0040](../doc/decisions/0040-rounds-bound-depth-restarts-bound-breadth.md)),
    # and this number stays the depth half of the pair.
    #
    # What one pass of this repository costs at most is 4 × 1h. The four
    # numbers in this block decide what a *ticket* costs between them, which is
    # why they are one block and why `lingtai add`, the board and the drain all
    # say it from `passCeiling` rather than each writing it out.
    rounds: 3

    # How many times a spent `rounds` ceiling starts the ticket over from the
    # base instead of asking a person
    # ([0040](../doc/decisions/0040-rounds-bound-depth-restarts-bound-breadth.md)).
    #
    # **Zero, which is what it was before the key existed** — a pass whose
    # rounds are spent blocks and asks. Written out rather than left to the
    # default for the reason `rounds` and `backoff` are: this is the repository
    # that has to be able to read its own policy without opening its own source,
    # and a ceiling that spends a whole extra pass is the last thing that should
    # be invisible when it is off (0025 §2).
    #
    # **Zero on the evidence, not on the argument.** Experiment 011 is one
    # ticket, and the failure that would justify the second ceiling — two fresh
    # starts both exhausting their rounds — has never been observed. So the
    # mechanism is built and off, and what turns it on is more runs in
    # `doc/experiments/`. Raising it here is the experiment: at `1` this
    # repository would spend at most 8 × 1h on a ticket before it is anyone's,
    # which is the number to be sure about first.
    restarts: 0

  # How much an agent is told about the attempts before it
  # ([0029](../doc/decisions/0029-the-prompt-budget-is-the-recipes.md)).
  #
  # `limits` above bounds what a run may spend; this bounds what it is given.
  # Written out for the same reason `backoff` and `repair` are: these numbers
  # decided what an agent knew about a failure while living in three source
  # files nobody read together, and this is the repository that has to be able
  # to read its own policy without opening its own source.
  #
  # Every value is the default. `evidence` was sized for a gate that was only
  # `pnpm typecheck && pnpm test` — failures short and specific, so 2000
  # characters is a whole one rather than a fragment. **Since the cold reviewer
  # went on at `proposed` (2026-09-09) two of these bind that did not before:**
  # `findings` is how many of a review's findings the next attempt is told about
  # — five, against a reviewer told to report only what it can write a failure
  # scenario for — and `diff` is what that reviewer is shown before truncation.
  budget:
    evidence: 2000
    attempts: 5
    findings: 5
    diff: 400000
